name: Keep Render App Awake

on:
  schedule:
    # Run every 14 minutes to prevent the 15-minute inactivity sleep
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render URL
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://secure-cyber-future.onrender.com/
